# Canonical metric registry.
# Each entry defines the authoritative column name, display label, unit type,
# whether raw values are percentage strings that need /100 conversion, and
# all synonym strings found in company press releases.
#
# unit: amount (dollar millions) | ratio (0-1) | count (shares/units) | special
# is_percentage: true => parse_percent() called; raw "44%" → stored as 0.44
# synonyms: all equivalent label strings found across companies (case-insensitive match)
# company_aliases: company-ticker-specific label overrides

metrics:

